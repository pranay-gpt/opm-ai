---
name: CI Integration (Self-Hosted)

on:
  workflow_dispatch:
    inputs:
      run-spe1:
        description: "Run SPE1 integration test (requires OPM Flow)"
        required: false
        type: boolean
        default: true

jobs:
  integration-tests:
    name: Integration Tests (requires OPM Flow)
    if: ${{ github.event.inputs.run-spe1 == true }}
    runs-on: [self-hosted, linux, opm-flow]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run SPE1 integration tests
        run: |
          pytest tests/integration/test_dataset_validation.py::test_scenario_deck_lints_and_validates -v
          pytest tests/integration/test_runner_spe1.py -v
        env:
          FLOW_INSTALLED: "true"

# This workflow requires a self-hosted runner with OPM Flow
# 2026.04+ installed.
#
# SETUP INSTRUCTIONS (see docs/ci-selfhosted.md for details):
# 1. Provision a Linux runner (Ubuntu 24.04 recommended)
# 2. Add OPM PPA and install OPM Flow:
#    sudo add-apt-repository -y ppa:opm/opm
#    sudo apt-get update
#    sudo apt-get install -y opm-simulators python3-opm-simulators \
#    python3-opm-common
# 3. Verify: `flow --version` should show 2026.04+
# 4. Register runner with labels: `self-hosted`, `linux`, `opm-flow`
# 5. Enable this workflow in GitHub Actions settings
#
# The runner needs: Ubuntu 24.04, 4GB+ RAM, 2+ CPUs, OPM Flow
# 2026.04+ from OPM PPA
