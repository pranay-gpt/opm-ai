services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./decks:/app/decks
      - ./results:/app/results
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

# 3D ResInsight snapshots are host-only by design: the bridge drives the
# ResInsight batch CLI, which needs a live X display, and the packaged
# ResInsight build ships without gRPC (no server to containerize). Run the
# backend on a desktop host to get snapshots; everything else works here.