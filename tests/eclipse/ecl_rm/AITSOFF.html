<p>Turns off the Intelligent Timestepping algorithm if
it has previously been turned on with the <a href="AITS.html#AITS"> AITS</a> keyword.</p>

<div class="section" id="aitsoff.example"><a name="aitsoff.example"><!-- --></a><h4 class="sectiontitle">Example</h4><p>Turn off Intelligent Timestepping.</p>
