<p>This keyword is used to specify a component number to be used with
the <a href="GASSATC.html#GASSATC">  GASSATC</a> or
the <a href="GASCONC.html#GASCONC">  GASCONC</a> keyword.
If there is only one component (N<sub>comps</sub>=1) the keyword is
optional.</p>
