<p>The <span class="keyword">NOLTRACE</span> keyword contains no items. When
this keyword is encountered, streamlines will not be retraced until
either an <a href="LTRACE.html#LTRACE"> LTRACE</a> or a <a href="LAGTRUPD.html#LAGTRUPD"> LAGTRUPD</a> keyword has been read in.</p>
