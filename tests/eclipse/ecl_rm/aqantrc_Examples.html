<div class="section" id="aqantrc_example_1"><a name="aqantrc_example_1"><!-- --></a><h4 class="sectiontitle">Example 1</h4>                      <p>With 2 aquifers specified in the keyword <a href="AQUDIMS.html#AQUDIMS"> AQUDIMS</a>:</p>
        
  <pre><code>AQANTRC
 1 WT1 1.0  /
 1 WT2 0.0  /
 2 WT1 0.0  /
 2 WT2 1.0  /
 /</code></pre>        </div>

<div class="section" id="aqantrc_example_2"><a name="aqantrc_example_2"><!-- --></a><h4 class="sectiontitle">Example 2</h4>                      <p>Set 60% concentration of TR6 in the first aquifer.</p>
           <pre><code>AQANTRC
1 TR6 0.6 /
/</code></pre>        </div>
