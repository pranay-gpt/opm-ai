 <div>
<div class="section" id="collapse_example_1"><a name="collapse_example_1"><!-- --></a><h4 class="sectiontitle">Example 1</h4>  <p>To keep
the top layer as original cells. (<samp class="codeph">NDIVIX</samp> =10, <samp class="codeph">NDIVIY</samp> =10 and <samp class="codeph">NDIVIZ</samp> =4 as specified in <span class="keyword">RUNSPEC</span> keyword <a href="DIMENS.html#DIMENS"> DIMENS</a>.) </p>
 <pre><code>COLLAPSE
 100*0
 100*1
 100*1
 100*1 /</code></pre> </div>

<div class="section" id="collapse_example_2"><a name="collapse_example_2"><!-- --></a><h4 class="sectiontitle">Example 2</h4>  <p>To return
the model to a full 3D VE model. (<samp class="codeph">NDIVIX</samp> =10, <samp class="codeph">NDIVIY</samp> =10, <samp class="codeph">NDIVIZ</samp> =4) </p>
 <pre><code>COLLAPSE
 400*0 /</code></pre> </div>
