<h1 class="topictitle1">Output control</h1>


 <div>
<p>Output of pore volumes, block center depths, transmissibilities,
diffusivities and NNCs is controlled by switches or mnemonics following
the <a href="RPTGRID.html#RPTGRID"> RPTGRID</a> keyword
in the <span class="keyword">GRID</span> section.</p>

<p>However, the values that are printed include the effect of any
changes made in the <span class="keyword">EDIT</span> section.</p>
