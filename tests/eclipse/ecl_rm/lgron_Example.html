 <div>
<div class="section" id="lgron_example_1"><a name="lgron_example_1"><!-- --></a><h4 class="sectiontitle">Example 1</h4><p>This switches
the refinement SOUTH on unconditionally:</p>
<pre><code>LGRON
 'SOUTH' /</code></pre></div>

<div class="section" id="lgron_example_2"><a name="lgron_example_2"><!-- --></a><h4 class="sectiontitle">Example 2</h4><p>The refinement
NORTH is on whenever it has 2 or more active wells, and off whenever
it has less than 2:</p>
<pre><code>LGRON
-- NAME     NWELLS
   'NORTH'  2      /</code></pre></div>
