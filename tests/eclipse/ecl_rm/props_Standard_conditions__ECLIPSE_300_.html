<h1 class="topictitle1">Standard conditions (ECLIPSE 300)</h1>


 <div>
<p>Surface gas volumes are reported as ideal gas volumes at standard
conditions - by default 1 atmosphere and 15.56 ° C (60 °F). Oil volumes
are reported at final stage separator conditions. The <a href="STCOND.html#STCOND"> STCOND</a> keyword can be
used to override the default conditions.</p>
