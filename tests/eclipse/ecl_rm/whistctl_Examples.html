<h1 class="topictitle1">Examples</h1>


 <div>
<div class="section" id="whistctl_example_1"><a name="whistctl_example_1"><!-- --></a><h4 class="sectiontitle">Example 1</h4><p>To change
the control mode of all history matching production wells to produce
the observed amount of oil:</p>
<pre><code>WHISTCTL
 ORAT /</code></pre></div>

<div class="section" id="whistctl_example_2"><a name="whistctl_example_2"><!-- --></a><h4 class="sectiontitle">Example 2</h4><p>To terminate
the run if a history matching well changes to BHP control (applying
no control mode override):</p>
<pre><code>WHISTCTL
1*  YES /</code></pre></div>

</div>

</div>
