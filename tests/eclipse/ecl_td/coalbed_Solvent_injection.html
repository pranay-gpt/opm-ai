<h1 class="topictitle1">Solvent injection</h1>


 <div>
<p>Solvent can be injected by specifying a gas injection well. A separate
keyword <a href="../ecl_rm/WSOLVENT.html#WSOLVENT">WSOLVENT</a> can then be used to specify the fraction of the gas flow
that is solvent.</p>
