<h1 class="topictitle1">Well properties</h1>


 <div>
<p>The fluid enthalpy for any injection wells can be specified with
the <a href="../ecl_rm/WINJTEMP.html#WINJTEMP">WINJTEMP</a> keyword.</p>

<p>Well BHPs (keywords <a href="../ecl_rm/WCONINJE.html#WCONINJE">WCONINJE</a> and <a href="../ecl_rm/WCONPROD.html#WCONPROD">WCONPROD</a>) should be set, since the default values in the Thermal option
are different from the default values used with black oil.</p>

</div>
