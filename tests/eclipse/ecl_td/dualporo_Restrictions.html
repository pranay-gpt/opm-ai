<h1 class="topictitle1">Restrictions</h1>


 <div>
<p>The option cannot at present be used with the following:</p>

<ul>
<li>gravity drainage models (<a href="../ecl_rm/GRAVDR.html#GRAVDR">GRAVDR</a>, <a href="../ecl_rm/GRAVDRM.html#GRAVDRM">GRAVDRM</a>)</li>

<li>Local grid refinement option</li>

<li>Dual permeability model</li>

<li>Parallel option</li>

</ul>

<p>and must use the following to initialize the sub-matrix cells</p>

<ul>
<li> <a href="../ecl_rm/EQUIL.html#EQUIL">EQUIL</a>                </li>

</ul>

</div>

</div>
