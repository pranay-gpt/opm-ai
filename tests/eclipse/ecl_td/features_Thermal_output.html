<h1 class="topictitle1">Thermal output</h1>


 <div>
<p>Temperature, energy, enthalpy and steam data can all be output
to the <samp class="codeph">SUMMARY</samp> file, <samp class="codeph">PRINT</samp> file
or for input to graphical post-processors. See the keywords <a href="../ecl_rm/SUMMARY.html#SUMMARY"> SUMMARY</a>, <a href="../ecl_rm/RPTSCHED.html#RPTSCHED">RPTSCHED</a> and <a href="../ecl_rm/RPTRST.html#RPTRST"> RPTRST</a>.</p>
