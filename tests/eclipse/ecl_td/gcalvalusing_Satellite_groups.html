<h1 class="topictitle1">Satellite groups</h1>


 <div>
<p>Energy can be produced or injected by satellite groups by specifying
a gas production or injection rate <strong>and </strong> defining a non-zero
calorific value for the gas. See the keywords <a href="../ecl_rm/GSATPROD.html#GSATPROD"> GSATPROD</a> and <a href="../ecl_rm/GSATINJE.html#GSATINJE"> GSATINJE</a> for more details.</p>
