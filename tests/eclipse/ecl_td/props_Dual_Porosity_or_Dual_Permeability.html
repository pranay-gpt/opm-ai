<h1 class="topictitle1">Dual porosity or dual permeability</h1>


 <div>
<p>A matrix-fracture thermal conductivity can be set using the <a href="../ecl_rm/THCONMF.html#THCONMF">THCONMF</a> keyword. The <a href="../ecl_rm/SIGMATH.html#SIGMATH">SIGMATH</a> keyword can be used
to set the multiplier used in calculating the matrix-fracture thermal
transmissibilities.</p>
