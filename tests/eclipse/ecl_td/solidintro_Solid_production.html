<h1 class="topictitle1">Solid production</h1>


 <div>
<p>If suspended solids are allowed, then solids will be produced by
producer wells. Solid production data can be output to the summary
file using the keywords specified in <a href="../ecl_rm/summary_Grid_block_and_region_quantities.html#summary.tab.283c"> Grid block solid quantities</a> and  <a href="../ecl_rm/summary_well_and_group_flow_quantities.html#summary.tab.173a">Solid production totals</a> in the  <cite>ECLIPSE Reference Manual.</cite></p>
