<h1 class="topictitle1">Restrictions</h1>


 <div>
<p>In ECLIPSE 300 this option is only valid for
black oil simulation using the <a href="../ecl_rm/BLACKOIL.html#BLACKOIL">BLACKOIL</a> keyword.</p>

<p>If a cell is defined with zero pore volume in the <span class="keyword">GRID</span> section, then making it active by changing the pore volume in the <span class="keyword">EDIT</span> section using <a href="../ecl_rm/PORV.html#PORV">PORV</a>, is not allowed with the temperature option.</p>

</div>
